name: T040 neural guard qualification only
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 947895afdb2ecef59654402cf08fe7ecdf92362f
          path: .dependencies/system
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: fdc15395928a1fa8eee62a2823b3c8777dcf0fa0
          path: .dependencies/legacy-system
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 0aab2fd3b03b4190d638e23c79a465afeecf5dfb
          path: .dependencies/runtime
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 93c87d05d4da54df49240141bf9ca993bc30b462
          path: .dependencies/watch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 6e82fdcaec0b73ed700d2104cfb4d94f011c19d4
          path: .dependencies/bridges
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
          ref: f42a6e07133c599a22acfaa8b8a0672ff996dc1b
          path: .dependencies/wave
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 6b2047500905f8f45087cb49989103a926fc5c63
          path: .dependencies/parent-utilities
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: fd4b1e52fe2a49c3c4c22f9ccd4c98a91f88afa0
          path: .dependencies/shared-system
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Candidate and untouched frozen packaging contracts
        run: |
          python -m unittest discover -s tests -p test_t040_neural_guard.py -v
          python -m unittest discover -s tests -p test_native_spectrum_release.py -v
      - name: Install existing pinned qualification compiler
        run: |
          python -m pip install Pillow platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Non-distributable before and after guard evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python scripts/qualify_t040_neural_guard.py qualify --parent-utilities .dependencies/parent-utilities --system .dependencies/system --legacy-system .dependencies/legacy-system --shared-system .dependencies/shared-system --runtime .dependencies/runtime --watch .dependencies/watch --bridges .dependencies/bridges --wave .dependencies/wave --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --output dist/t040-qualification-only
          echo "receipt_sha256=$(sha256sum dist/t040-qualification-only/candidate-evidence.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t040-qualification-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/t040-qualification-only/
          include-hidden-files: true
          retention-days: 90
      - uses: actions/download-artifact@v4
        with:
          name: t040-qualification-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/t040-qualification-only-downloaded
      - name: Verify transported exact-head evidence without publishing
        run: |
          python scripts/qualify_t040_neural_guard.py verify --artifact "$RUNNER_TEMP/t040-qualification-only-downloaded" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" --receipt-sha256 "${{ steps.evidence.outputs.receipt_sha256 }}"
