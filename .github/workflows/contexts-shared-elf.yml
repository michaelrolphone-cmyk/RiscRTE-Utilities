name: Contexts one shared ELF
on:
  push:
    branches: [work/contexts-shared-elf-20261102]
  pull_request:
    paths: ['Apps/contexts*', 'lib/Contexts/**', 'scripts/*contexts*', 'test/contexts/**', '.github/workflows/contexts-shared-elf.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .dependencies/system/scripts
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: f965f1eb974c8e637f222bfc1ac57fc19402b6cf
          path: .dependencies/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 13eca114cb58469cf6004fafc3da84fbd9d29beb
          path: .dependencies/runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.3.0
      - name: Optional capability and preserved data regressions
        run: |
          python scripts/test_contexts_shared_elf.py --runtime .dependencies/runtime --system-apps .dependencies/system --output build/shared-faults
          python scripts/test_contexts_shared_elf.py --runtime .dependencies/runtime --system-apps .dependencies/system --output build/shared-faults-sanitized --sanitize
      - name: Common app real renderer and text lifecycle
        env:
          CONTEXTS_SHARED_ELF_TEST: '1'
        run: |
          python scripts/test_contexts_native.py --runtime .dependencies/runtime --system-apps .dependencies/system --output build/shared-native
          python scripts/test_contexts_native.py --runtime .dependencies/runtime --system-apps .dependencies/system --output build/shared-native-sanitized --sanitize
          python scripts/test_contexts_shared_input.py --runtime .dependencies/runtime --system-apps .dependencies/system --output build/shared-paper --sanitize
      - name: Install pinned compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build the single device-independent ELF
        run: python scripts/build_contexts_shared.py --runtime .dependencies/runtime --system-apps .dependencies/system --output build/shared-target
      - name: Publish immutable qualified prerelease
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_contexts_shared.py --build build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contexts-shared-${{ github.sha }}
          path: |
            build/shared-*/results.json
            build/shared-*/**/run.log
            build/shared-faults*/*.log
            build/shared-target/
          if-no-files-found: error
          retention-days: 30
