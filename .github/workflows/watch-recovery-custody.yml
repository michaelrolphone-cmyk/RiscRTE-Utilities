name: Watch recovery source custody
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch-recovery-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_watch_recovery_source.py
