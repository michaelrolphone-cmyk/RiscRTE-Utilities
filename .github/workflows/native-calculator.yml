name: Native Calculator qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 18143e2927510e70ef1d6437417aacbf3bb9c524
          path: .dependencies/calculator-system
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: a7f08a9db7342a69ef5b9bc03e3b1ea60dafbb7c
          path: .dependencies/paper-system
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native production app and private ownership
        run: |
          python .dependencies/calculator-system/scripts/test_calculator_native_input.py
          python .dependencies/calculator-system/scripts/test_calculator_native_optout.py
          python scripts/test_calculator_native.py --system-apps .dependencies/calculator-system --app calculator
          python scripts/test_calculator_native.py --system-apps .dependencies/calculator-system --app calculator --snapshot
      - name: Legacy and paper regression controls
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python scripts/test_nova_utility.py --system-apps .dependencies/calculator-system --app calculator
          python scripts/test_paper_utilities.py --system-apps .dependencies/paper-system
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Native target admission
        run: python scripts/build_nova_utility.py --system-apps .dependencies/calculator-system --app calculator --native-calculator
      - uses: actions/upload-artifact@v4
        with:
          name: native-calculator-source-${{ github.sha }}
          path: |
            dist/native-calculator/
            build/calculator-native/**/receipt.json
          if-no-files-found: error
          retention-days: 14
