name: Independent utility build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test SDK baseline, manifests, integrity and drift classification
        run: python -m unittest discover -s tests -v
      - name: Exercise app UI and provider interaction fixtures
        run: |
          python scripts/test_apps.py
      - name: Exact shared portable client source
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 911be9e8042f1bcc46038fb70189eebe4ca106c5
          path: .dependencies/system-apps
          persist-credentials: false
      - name: Exact generic provider-storage source
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: b2fc83280c54ca3ebd567184cc50e4785daa3951
          path: .dependencies/runtime
          persist-credentials: false
      - name: Exercise staged Alarm and Countdown production source
        run: |
          python scripts/test_alarm_apps.py --system-apps .dependencies/system-apps --runtime .dependencies/runtime
          python scripts/test_alarm_sleep_resume.py --system-apps .dependencies/system-apps --runtime .dependencies/runtime
          python scripts/test_points_apps.py --system-apps .dependencies/system-apps --runtime .dependencies/runtime
          python scripts/test_alarm_volume.py --system-apps .dependencies/system-apps --runtime .dependencies/runtime
          python scripts/test_dnd_service.py --system-apps .dependencies/system-apps --runtime .dependencies/runtime
          bash scripts/test_alarm_runtime.sh .dependencies/runtime .dependencies/system-apps
          SANITIZE=1 bash scripts/test_alarm_runtime.sh .dependencies/runtime .dependencies/system-apps
      - name: Exact non-modal cue-aware client
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 13f32d3e5fee262a960f5fe0add63db835381893
          path: .dependencies/cue-system-apps
          persist-credentials: false
      - name: Exercise actual Points cues against app-owned audio
        run: python scripts/test_points_audio_cues.py --system-apps .dependencies/cue-system-apps --runtime .dependencies/runtime
      - name: Exercise shared Calculator and Stopwatch
        run: python scripts/test_daily_apps.py --system-apps .dependencies/system-apps
      - name: Exact shared native geometry source
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 1f8f8f52183b9a8ee7e796aebb6d2869772cd07b
          path: .dependencies/native-geometry-system
          persist-credentials: false
      # Published snapshot: both consumed headers are byte-identical to Runtime046f4c22.
      - name: Exact native geometry Runtime headers
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 318d77283ba707b6f2820d2833e5d7ea3ff3f7e8
          path: .dependencies/native-geometry-runtime
          persist-credentials: false
      - name: Qualify native rendering and touch across safe-area geometries
        run: >-
          python scripts/test_native_safe_content.py
          --system .dependencies/native-geometry-system
          --system-revision 1f8f8f52183b9a8ee7e796aebb6d2869772cd07b
          --runtime .dependencies/native-geometry-runtime
          --output dist/native-safe-content-tests
      - name: Exact shared audio lifecycle adapter
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: fdc15395928a1fa8eee62a2823b3c8777dcf0fa0
          path: .dependencies/audio-system-apps
          persist-credentials: false
      - name: Exact current audio Runtime source
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 0fa8c576f547817b8124ed10686d80a6351bb634
          path: .dependencies/audio-runtime
          persist-credentials: false
      - name: Exact Spectrum app-data Runtime source
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: c3d750d113dbc79af87daaad316ab1d63d57dd60
          path: .dependencies/spectrum-runtime
          persist-credentials: false
      - name: Exercise Spectrum saves against the real Runtime backend
        run: bash scripts/test_spectrum_app_data.sh .dependencies/spectrum-runtime
      - name: Exercise shared Audio Tools and lifecycle
        run: |
          python scripts/test_frequency_generator.py --system-apps .dependencies/audio-system-apps
          python scripts/test_frequency_renderer.py --system-apps .dependencies/audio-system-apps
          python scripts/test_audio_spectrum.py --system-apps .dependencies/audio-system-apps
          python scripts/test_spectrum_renderer.py --system-apps .dependencies/audio-system-apps
          python scripts/test_spectrum_temporal_renderer.py --system-apps .dependencies/audio-system-apps
          python scripts/test_audio_service_lifecycle.py --system-apps .dependencies/audio-system-apps --runtime .dependencies/audio-runtime
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and structurally validate all application ELFs
        run: |
          python scripts/build_all_apps.py
          python scripts/check_release_parity.py
          python scripts/build_portable_apps.py --system-apps .dependencies/system-apps
          python scripts/build_alarm_apps.py --system-apps .dependencies/system-apps --runtime .dependencies/runtime
          python scripts/build_points_service.py --system-apps .dependencies/system-apps --runtime .dependencies/runtime
          python scripts/build_points_service.py --system-apps .dependencies/system-apps --runtime .dependencies/runtime --visual-only
          python scripts/build_audio_apps.py --system-apps .dependencies/audio-system-apps
          bash scripts/test_alarm_target_loader.sh .dependencies/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: utilities-development-${{ github.sha }}
          path: |
            dist/apps/
            dist/portable-apps/
            dist/native-safe-content-tests/
            dist/alarm-apps/
            dist/points-service/
            dist/visual-points-service/
            dist/audio-apps/
            build/frequency-renderer/
          if-no-files-found: error
          retention-days: 14

  nova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [calculator, stopwatch, battery, alarms, countdown]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 13f32d3e5fee262a960f5fe0add63db835381893
          path: .dependencies/nova-system
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_nova_utility.py --app ${{ matrix.app }} --system-apps .dependencies/nova-system
      - name: Exercise alarm volume controller
        if: matrix.app == 'alarms'
        run: python scripts/test_nova_alarm_volume.py --system-apps .dependencies/nova-system
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - run: python scripts/build_nova_utility.py --app ${{ matrix.app }} --system-apps .dependencies/nova-system
      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.app }}-${{ github.sha }}
          path: dist/nova/
          if-no-files-found: error
          retention-days: 14

  lora-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: c5c76883fa4db4de9c81345fdb225b38192231c1
          path: .dependencies/lora-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: fc4fe03a0ed26222aae4848ff587fb6137390106
          path: .dependencies/lora-watch
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify LoRa state, radio errors, keyboard and Nova frames
        run: |
          python scripts/check_lora_abi.py --watch .dependencies/lora-watch
          python scripts/test_lora_messages.py --system-apps .dependencies/lora-system
          python scripts/test_lora_renderer.py --system-apps .dependencies/lora-system
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and validate portable LoRa ELF
        run: python scripts/build_lora_apps.py --system-apps .dependencies/lora-system
      - uses: actions/upload-artifact@v4
        with:
          name: lora-messages-${{ github.sha }}
          path: |
            dist/lora-apps/
            build/lora-renderer/
          if-no-files-found: error
          retention-days: 14
