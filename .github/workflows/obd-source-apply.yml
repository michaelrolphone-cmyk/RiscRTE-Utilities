name: Publish OBD source
on:
  push:
    branches: [feat/obd-dashboard]
    paths: [.github/workflows/obd-source-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact tested source
        run: |
          set -euo pipefail
          git diff --exit-code 43e36e25dcf97985b39f0b3dba01241d898ede27 HEAD -- Apps scripts test
          python3 - <<'PY'
          import base64,lzma,hashlib
          from pathlib import Path
          encoded=''.join(Path(f'.obd-source/{i:02}.txt').read_text().strip() for i in (1,2))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='2ae76917fd014b7370f6e3ddf0afd017a606a36677fcef268e22673756f1fe21'
          Path('/tmp/obd.patch').write_bytes(patch)
          PY
          git apply --check /tmp/obd.patch
          git apply --index /tmp/obd.patch
          git rm .obd-source/*.txt
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement read-only OBD dashboard using shared scene and BLE serial capabilities'
          git push origin HEAD:feat/obd-dashboard
