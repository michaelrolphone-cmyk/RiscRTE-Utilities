name: Native UTC visual alarm profile
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-utc-alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 1d589d90bf27c7ffb76420de46564088ddb3714f
          path: .dependencies/native-system
          persist-credentials: false
      - name: Separate later System SDK for legacy app regressions
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: d52a74bfb4acc01cc3f0a9dda2c95ba2ba679ee9
          path: .dependencies/regression-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 30dcec5ce6ce33223f2b203a2399283e1f758567
          path: .dependencies/native-runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native UTC behavior and legacy regressions
        run: |
          python scripts/test_native_utc_alarm.py --system-apps .dependencies/native-system --runtime .dependencies/native-runtime
          python scripts/test_points_apps.py --system-apps .dependencies/regression-system --runtime .dependencies/native-runtime
          python scripts/test_alarm_apps.py --system-apps .dependencies/regression-system --runtime .dependencies/native-runtime
          python scripts/test_alarm_volume.py --system-apps .dependencies/regression-system --runtime .dependencies/native-runtime
          python scripts/test_dnd_service.py --system-apps .dependencies/regression-system --runtime .dependencies/native-runtime
          bash scripts/test_native_utc_alarm_runtime.sh .dependencies/native-runtime .dependencies/native-system
          SANITIZE=1 bash scripts/test_native_utc_alarm_runtime.sh .dependencies/native-runtime .dependencies/native-system
      - name: Install pinned public compiler in CI
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Target ELF, loader and exact flag-off byte gates
        env:
          NATIVE_APP_CC: /home/runner/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc
        run: python scripts/build_native_utc_alarm.py --system-apps .dependencies/native-system --runtime .dependencies/native-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: native-utc-visual-alarm-${{ github.sha }}
          path: dist/native-utc-visual-service/
          if-no-files-found: error
          retention-days: 14
