name: Contexts service and editor
on:
  pull_request:
  push:
    branches: [main, fix/native-crown-exit-reconstructed]
  workflow_dispatch:
env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"
permissions:
  contents: read
jobs:
  contexts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: f1db70fcc3ba9df2a3551a711a9d3b0b714a5f8a
          path: .dependencies/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: aac1cb342696e96345d4546e2c69023834c6c8d4
          path: .dependencies/drivers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 3b90cd11cf0ff4e8116bb54d2d9eb9c7c67a148b
          path: .dependencies/runtime
          persist-credentials: false
      - name: Verify explicit RF-only contract compatibility
        run: |
          python3 scripts/check_contexts_contract.py --system-apps .dependencies/system
          python3 -m unittest discover -s tests -p test_contexts_contract.py -v
      - name: Test production service, owner export and real Contexts entry point
        run: |
          python3 scripts/test_context_fingerprints.py --drivers .dependencies/drivers --runtime .dependencies/runtime
          python3 scripts/test_contexts_service.py --drivers .dependencies/drivers --runtime .dependencies/runtime --system-apps .dependencies/system
          python3 scripts/test_contexts_scene.py --system-apps .dependencies/system --runtime .dependencies/runtime --frames build/contexts-scene
          python3 scripts/test_contexts_scene.py --system-apps .dependencies/system --runtime .dependencies/runtime --frames build/contexts-scene-sanitizer --sanitize
          python3 scripts/test_contexts_rf_retained.py --system-apps .dependencies/system
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and validate both shipping Contexts packages
        run: |
          python3 scripts/build_contexts_scene.py --runtime .dependencies/runtime --system-apps .dependencies/system --target watch --output dist/contexts-watch
          python3 scripts/build_contexts_scene.py --runtime .dependencies/runtime --system-apps .dependencies/system --target x4 --output dist/contexts-x4
      - name: Build both learning services
        run: |
          export NATIVE_APP_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          python3 scripts/build_contexts_service.py --runtime .dependencies/runtime --system-apps .dependencies/system --drivers .dependencies/drivers --profile full
          python3 scripts/build_contexts_service.py --runtime .dependencies/runtime --system-apps .dependencies/system --drivers .dependencies/drivers --profile rf-only
      - uses: actions/upload-artifact@v4
        with:
          name: contexts-scene-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/contexts-scene/
            build/contexts-scene-sanitizer/
            dist/contexts-watch/
            dist/contexts-x4/
            dist/contexts-service/
            dist/contexts-service-rf-only/
          if-no-files-found: error
          retention-days: 14
