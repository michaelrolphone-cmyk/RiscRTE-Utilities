name: T039 BLE candidate package
on:
  push:
    branches: [work/t039-candidate-package-20261021]
  pull_request:
    paths: ['Apps/candidates/t039/**', 'scripts/package_t039_candidate.py', 'scripts/t039_candidate_manifest.py', 'tests/t039_candidate_manifest_test.cpp', 'tests/test_t039_candidate_package.py', 'docs/t039/candidate-package/**', '.github/workflows/t039-ble-package.yml']
permissions:
  contents: read
jobs:
  candidate-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 9a7a508d0a43572684c7feb64958eb31ee1fd583
          path: .dependencies/pr94
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 6b2047500905f8f45087cb49989103a926fc5c63
          path: .dependencies/parent-utilities
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: f3731ab02127dea86a308472e3780068c5a0a1cf
          path: .dependencies/system
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: f1db70fcc3ba9df2a3551a711a9d3b0b714a5f8a
          path: .dependencies/legacy-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 0aab2fd3b03b4190d638e23c79a465afeecf5dfb
          path: .dependencies/runtime
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 6e82fdcaec0b73ed700d2104cfb4d94f011c19d4
          path: .dependencies/bridges
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 851b8998e804c57b2c9f42d9f8fd0a69e79f2b41
          path: .dependencies/watch-touch
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Candidate package and unchanged frozen contracts
        run: |
          python -m unittest discover -s tests -p test_t039_candidate_package.py -v
          python -m unittest discover -s tests -p test_t039_ble_candidate.py -v
          python -m unittest discover -s tests -p test_native_ble_buttons_release.py -v
      - name: Install existing pinned qualification compiler
        run: |
          python -m pip install Pillow platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Rebuild exact PR94 controls without changing its qualification-only contract
        id: evidence
        run: |
          set -euo pipefail
          python .dependencies/pr94/scripts/qualify_t039_ble_candidate.py qualify --parent-utilities "$PWD/.dependencies/parent-utilities" --system "$PWD/.dependencies/system" --legacy-system "$PWD/.dependencies/legacy-system" --runtime "$PWD/.dependencies/runtime" --bridges "$PWD/.dependencies/bridges" --watch "$PWD/.dependencies/watch-touch" --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --output dist/t039-pr94-controls
          echo "receipt_sha256=$(sha256sum dist/t039-pr94-controls/candidate-evidence.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Build distinct candidate and production metadata/admission evidence
        id: package
        run: |
          set -euo pipefail
          python scripts/package_t039_candidate.py build --evidence dist/t039-pr94-controls --evidence-sha256 "${{ steps.evidence.outputs.receipt_sha256 }}" --system "$PWD/.dependencies/system" --runtime "$PWD/.dependencies/runtime" --bridges "$PWD/.dependencies/bridges" --output dist/t039-candidate-package
          echo "receipt_sha256=$(sha256sum dist/t039-candidate-package/candidate-package.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t039-candidate-0.1.31-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/t039-candidate-package/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: t039-candidate-0.1.31-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/t039-candidate-downloaded
      - name: Verify transported candidate with producer receipt digest
        run: |
          python scripts/package_t039_candidate.py verify --artifact "$RUNNER_TEMP/t039-candidate-downloaded" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" --receipt-sha256 "${{ steps.package.outputs.receipt_sha256 }}"
