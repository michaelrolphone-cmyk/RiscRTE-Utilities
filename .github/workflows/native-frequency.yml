name: Native Frequency qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: pin
        run: echo "system=$(python3 -c 'import json; print(json.load(open("sdk/frequency-native-sources.json"))["system_apps"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pin.outputs.system }}
          path: .dependencies/frequency-system
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native app and ownership matrix
        run: |
          python3 .dependencies/frequency-system/scripts/test_frequency_native_input.py
          python3 .dependencies/frequency-system/scripts/test_frequency_native_optout.py
          python3 scripts/test_frequency_native.py --system-apps .dependencies/frequency-system
          python3 scripts/test_frequency_native.py --system-apps .dependencies/frequency-system --snapshot
      - name: Exact standalone host composition
        run: |
          python3 scripts/frequency_native_profile.py
          python3 scripts/test_frequency_native_standalone.py --system-apps .dependencies/frequency-system
          python3 scripts/test_frequency_native_standalone.py --system-apps .dependencies/frequency-system --snapshot
      - name: Legacy, paper and audio controls
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: |
          python3 scripts/test_frequency_native_optout.py --system-apps .dependencies/frequency-system
          python3 scripts/test_frequency_generator.py --system-apps .dependencies/frequency-system
          python3 scripts/test_frequency_renderer.py --system-apps .dependencies/frequency-system --compact
          python3 .dependencies/frequency-system/scripts/test_portable_audio.py
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Native target admission
        run: |
          python3 scripts/build_frequency_native.py --system-apps .dependencies/frequency-system
          python3 scripts/build_frequency_native.py --system-apps .dependencies/frequency-system --snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: native-frequency-source-${{ github.sha }}
          path: |
            dist/frequency-native/
            build/frequency-native/**/receipt.json
            build/frequency-native-standalone/**/receipt.json
            build/frequency-native-optout/receipt.json
            build/frequency-renderer/**/receipt.json
          if-no-files-found: error
          retention-days: 14
