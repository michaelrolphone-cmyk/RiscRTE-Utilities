name: BLE HID Utilities
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hid-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 2aa0cf63346e507525af884bbfbf6b69313442c4
          path: .dependencies/hid-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 2317b4fca374bb2b9cfe8dd204aa22244d1db609
          path: .dependencies/hid-runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host and production Nova application tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/test_hid_apps.py --system-apps .dependencies/hid-system
          python scripts/test_hid_renderer.py --system-apps .dependencies/hid-system
          python scripts/test_hid_renderer.py --system-apps .dependencies/hid-system --paper
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and structurally validate target ELFs
        run: |
          python scripts/build_hid_apps.py --system-apps .dependencies/hid-system
          python scripts/build_hid_apps.py --system-apps .dependencies/hid-system --paper-profile
      - name: Production Runtime package admission
        run: |
          python scripts/test_hid_runtime_prepare.py --runtime .dependencies/hid-runtime --packages dist/hid-apps
          python scripts/test_hid_runtime_prepare.py --runtime .dependencies/hid-runtime --packages dist/hid-paper
      - uses: actions/upload-artifact@v4
        with:
          name: ble-hid-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/hid-apps/
            dist/hid-paper/
            build/hid-paper-renderer/
            build/hid-apps/*-frames/
            build/hid-renderer/
          retention-days: 14
          if-no-files-found: error
