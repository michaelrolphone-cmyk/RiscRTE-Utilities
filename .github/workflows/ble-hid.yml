name: BLE HID Utilities
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hid-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: d5b6c0fa7c06bb36a776e7ce501028a9827221e2
          path: .dependencies/hid-system
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host and production Nova application tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/test_hid_apps.py --system-apps .dependencies/hid-system
          python scripts/test_hid_renderer.py --system-apps .dependencies/hid-system
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and structurally validate target ELFs
        run: python scripts/build_hid_apps.py --system-apps .dependencies/hid-system
      - uses: actions/upload-artifact@v4
        with:
          name: ble-hid-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/hid-apps/
            build/hid-apps/*-frames/
            build/hid-renderer/
          retention-days: 14
          if-no-files-found: error
