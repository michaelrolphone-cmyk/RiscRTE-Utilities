name: LoRa modal policy
on:
  push:
    branches: [work/lora-input-policy-20261012]
  pull_request:
    paths: ['Apps/lora_messages.c', 'test/lora_shared_input/**', 'test/native_apps/lora_shared_renderer_test.c', 'scripts/test_lora_policy.py', 'scripts/test_lora_shared_input.py', '.github/workflows/lora-input-policy.yml']
permissions:
  contents: read
jobs:
  real-host-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: fd4b1e52fe2a49c3c4c22f9ccd4c98a91f88afa0
          path: .dependencies/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 64c8e52e46fd91e8fdafd636db04eed88f0c51a9
          path: .dependencies/watch-runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 089868395268b696c05651c33816345bfe0425df
          path: .dependencies/watch-profile
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: b1b2ba9466cc7243570471c0f9e728367dd4bafe
          path: .dependencies/baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow fonttools
      - run: >-
          python scripts/test_lora_policy.py
          --system-apps .dependencies/system
          --watch-runtime .dependencies/watch-runtime
          --watch-profile .dependencies/watch-profile
          --output build/lora-policy
      - run: python scripts/test_lora_messages.py --system-apps .dependencies/system
      - run: python -m unittest discover -s tests -v
      - run: python scripts/test_lora_policy_parity.py --system-apps .dependencies/system --baseline-utilities .dependencies/baseline --output build/lora-policy/parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lora-policy-evidence
          path: |
            build/lora-policy/**/qualification.json
            build/lora-policy/**/run.log
