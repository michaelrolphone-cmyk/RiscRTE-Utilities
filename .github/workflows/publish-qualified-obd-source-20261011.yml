name: Publish qualified Utilities OBD source 2026-10-11.1
on:
  push:
    branches: [publish/utilities-source-20261011-1]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: utilities-source-v2026.10.11.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE-Utilities'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify source and CI, publish corrected source and link prior snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, urllib.request, urllib.error, urllib.parse
          repo = "michaelrolphone-cmyk/RiscRTE-Utilities"
          source = "c215abd4d3ebf566a8f536539605191ce182ed29"
          qualified = "2e2b6706bac02e0c135ab4a156b83ca9ea966825"
          tree = "b6000021d77a70e1221ad82befdbc361ffa74b38"
          tag = "source-v2026.10.11.1"
          required = [".github/workflows/alarm-abi.yml",".github/workflows/battery-power.yml",".github/workflows/ble-hid.yml",".github/workflows/ble-scanner.yml",".github/workflows/build.yml",".github/workflows/canvas-apps.yml",".github/workflows/contexts.yml",".github/workflows/native-utc-alarm.yml",".github/workflows/obd-dashboard.yml",".github/workflows/paper-utilities.yml",".github/workflows/waterfall.yml"]
          token = os.environ["GH_TOKEN"]
          root = "https://api.github.com/repos/" + repo
          def api(path, data=None, method=None, optional=False):
              req = urllib.request.Request(root + path, data=None if data is None else json.dumps(data).encode(),
                  method=method or ("POST" if data is not None else "GET"),
                  headers={"Authorization":"Bearer " + token, "Accept":"application/vnd.github+json",
                           "X-GitHub-Api-Version":"2022-11-28", "Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if optional and error.code == 404:
                      return None
                  raise
          assert os.environ["GITHUB_REPOSITORY"] == repo
          pr = api("/pulls/63")
          assert pr["merged"] and pr["merge_commit_sha"] == source
          assert pr["head"]["sha"] == qualified and pr["base"]["ref"] == "main"
          assert api("/git/commits/" + source)["tree"]["sha"] == tree
          assert api("/git/commits/" + qualified)["tree"]["sha"] == tree
          assert api("/compare/" + source + "...main")["status"] in ("ahead", "identical")
          runs = api("/actions/runs?head_sha=" + qualified + "&per_page=100")["workflow_runs"]
          verified = []
          for path in required:
              matches = [r for r in runs if r["path"] == path and r["event"] == "pull_request"
                  and r["head_sha"] == qualified and r["head_branch"] == "release/obd-manifest-20261011"]
              assert matches, "Missing required CI: " + path
              run = max(matches, key=lambda r:r["id"])
              assert run["status"] == "completed" and run["conclusion"] == "success", path
              verified.append({k:run[k] for k in ("id", "path", "head_sha", "html_url", "conclusion", "event")})
          assert api("/git/ref/tags/" + tag, optional=True) is None, "Tag collision: refusing overwrite"
          assert api("/releases/tags/" + tag, optional=True) is None, "Release collision: refusing overwrite"
          record = {"repository":repo, "tag":tag, "source_commit":source, "source_tree":tree,
              "qualified_pr_head":qualified, "pull_request":pr["html_url"], "ci":verified,
              "qualification":"Source-only integration; no new hardware qualification or full product firmware."}
          payload = (json.dumps(record, indent=2, sort_keys=True) + "\n").encode()
          name = tag + "-provenance.json"
          digest = hashlib.sha256(payload).hexdigest()
          body = ("Completed OBD Dashboard 0.1.1 native-manifest correction, reconciled onto the qualified Utilities source integration.\n\n"
              "Exact source commit: " + source + "\nQualified PR head: " + qualified + "\nSource tree: " + tree + "\n\n"
              "All eleven current exact-head workflows passed; the merge tree is identical to the tested source tree. "
              "The six-file correction supplies native architecture/entry, supported-file-types and foreground lifecycle, "
              "removes incompatible catalog-only fields, and binds build metadata to the declared version. "
              "Dashboard and vehicle protocol behavior are unchanged. Spectrum, Scanner and HID fixture repairs, "
              "including fast queued Save during asynchronous paper refresh, are preserved.\n\n"
              "The earlier source-v2026.10.11 snapshot contains the superseded OBD 0.1.0 manifest. "
              "Its source tag remains unchanged. Original PR60 source history and compiled component receipts are retained.\n\n"
              "This is a source-only release. It does not publish or qualify the separate X4 OBD firmware baseline. "
              "Physical BLE/owned-adapter/vehicle compatibility remains unverified; bonding-required BLE and Classic SPP are unsupported. "
              "Contexts 0.4.1 learning and crown-recovery reconciliation is separate and is not included in this snapshot. "
              "No hardware was flashed.\n\nProvenance SHA256: " + digest + "\n")
          api("/git/refs", {"ref":"refs/tags/" + tag, "sha":source})
          release = api("/releases", {"tag_name":tag, "target_commitish":source,
              "name":"Utilities OBD manifest source 2026-10-11.1", "body":body, "draft":False,
              "prerelease":False, "make_latest":"false"})
          upload = release["upload_url"].split("{",1)[0] + "?name=" + name
          assert urllib.parse.urlsplit(upload).scheme == "https" and urllib.parse.urlsplit(upload).hostname == "uploads.github.com"
          request = urllib.request.Request(upload, data=payload, method="POST",
              headers={"Authorization":"Bearer " + token, "Accept":"application/vnd.github+json",
                       "Content-Type":"application/json"})
          with urllib.request.urlopen(request, timeout=60) as response:
              asset = json.load(response)
          assert asset["name"] == name and asset["size"] == len(payload)
          if asset.get("digest"):
              assert asset["digest"] == "sha256:" + digest
          assert api("/git/ref/tags/" + tag)["object"]["sha"] == source
          assert api("/releases/tags/" + tag)["id"] == release["id"]
          print(release["html_url"])
          print(asset["browser_download_url"])
          print("provenance_sha256=" + digest)
          
          old = api("/releases/tags/source-v2026.10.11")
          assert old["id"] == 409808161 and old["target_commitish"] == "b2c0ad80c1825b7aae7b4485ee7f6a5cedc426ba"
          notice = ("Source correction: [" + tag + "](" + release["html_url"] + ") supplies the native-compatible OBD 0.1.1 manifest. "
                    "This earlier source snapshot contains the superseded OBD 0.1.0 manifest; use the follow-up source for OBD deployment. "
                    "The source tag and archives below are unchanged.\n\n")
          assert not old["body"].startswith(notice), "Correction notice already applied"
          api("/releases/" + str(old["id"]), {"body":notice + old["body"]}, method="PATCH")
          print("Previous source release now links the native-manifest correction.")
          
