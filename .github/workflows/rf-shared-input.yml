name: RF shared input safety
on:
  push:
    branches: [work/rf-shared-input-20261012, work/rf-input-policy-20261012]
  pull_request:
    paths:
      - 'Apps/waterfall.c'
      - 'Apps/rf_application.inc'
      - 'Apps/context_signal_library.inc'
      - 'Apps/rf_app_data_scope.h'
      - 'Apps/rf_temporal_app.inc'
      - 'Apps/context_fingerprint_app.inc'
      - 'test/native_apps/rf_shared_input_safety_test.c'
      - 'test/native_apps/rf_app_data_scope_test.c'
      - 'scripts/test_rf_shared_input_safety.py'
      - 'scripts/shared_input_parity_reference.py'
      - 'test/shared_input_parity/**'
      - 'tests/test_shared_input_parity_reference.py'
      - 'scripts/test_rf_application.py'
      - 'test/native_apps/rf_renderer_test.c'
      - '.github/workflows/rf-shared-input.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: fd4b1e52fe2a49c3c4c22f9ccd4c98a91f88afa0
          path: .dependencies/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 82d17d0d902d427938af95aae0e976c8f78041ed
          path: .dependencies/baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 96742a20af660808cae6cd3a36eadd12a83a460f
          path: .dependencies/renderer-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 712ecc3f894dba99d9c9638941778a82f5856b97
          path: .dependencies/runtime
          persist-credentials: false
      - name: Actual opt-out RF controller and local keyboard
        run: >-
          python scripts/test_rf_application.py
          --system-apps .dependencies/renderer-system --runtime .dependencies/runtime --opt-out-contract
          --scene labels-keyboard --scene keyboard-cancel --scene guard-keyboard
          --scene guard-label-draft --scene slow-history --scene root-exit --scene local-opt-out-contract
      - name: Shared-client lifecycle, distinct Home, storage scope and opt-out parity
        run: python scripts/test_rf_shared_input_safety.py --system-apps .dependencies/system --baseline-utilities .dependencies/baseline
      - name: Source manifest and inventory contracts
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf-shared-input-safety-${{ github.sha }}
          path: |
            build/rf-shared-input-safety/
            build/rf-application/
