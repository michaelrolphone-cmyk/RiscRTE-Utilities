name: Native BLE Scanner qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: d79406e71ef7f59e54e1079259bca3aa040b5e2f
          path: .dependencies/scanner-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: a7ae39994603c4545a3c014f09051ecfc12084d2
          path: .dependencies/scanner-drivers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual native scanner, ownership and shared providers
        run: |
          python scripts/test_ble_scanner_native.py --system-apps .dependencies/scanner-system --drivers .dependencies/scanner-drivers
          python .dependencies/scanner-system/scripts/test_ble_scanner_native_input.py
      - name: Legacy scanner and paper regressions
        run: |
          python scripts/test_ble_scanner.py --system-apps .dependencies/scanner-system
          python scripts/test_ble_renderer.py --system-apps .dependencies/scanner-system --drivers .dependencies/scanner-drivers
          python scripts/test_ble_paper.py --system-apps .dependencies/scanner-system --drivers .dependencies/scanner-drivers
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Native target and paper-selector bypass admission
        run: |
          python scripts/build_ble_apps.py --system-apps .dependencies/scanner-system --native-ui --navigation --output-dir dist/ble-scanner-native
          python scripts/build_ble_apps.py --system-apps .dependencies/scanner-system --native-ui --paper-profile --display-rotation 90 --navigation --partial-damage --output-dir dist/ble-scanner-native-paper
      - uses: actions/upload-artifact@v4
        with:
          name: native-ble-scanner-source-${{ github.sha }}
          path: |
            dist/ble-scanner-native/
            dist/ble-scanner-native-paper/
          if-no-files-found: error
          retention-days: 14
