name: Shared color alarm sleep retry
on:
  push:
    branches: [fix/sleep-storage-reconcile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alarm-sleep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone exact public source inputs as build owner
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/alarm-sleep-$GITHUB_SHA"
          mkdir -p "$root"
          echo "ALARM_ROOT=$root" >> "$GITHUB_ENV"
          clone() {
            git init --quiet "$root/$3"
            git -C "$root/$3" remote add origin "https://github.com/michaelrolphone-cmyk/$1.git"
            git -C "$root/$3" fetch --quiet --no-tags --depth=1 origin "$2"
            git -C "$root/$3" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$root/$3" rev-parse HEAD)" = "$2"
          }
          clone RiscRTE-Utilities "$GITHUB_SHA" utilities
          clone RiscRTE 659d859acb122640ef4003bb8d7099501d4381be runtime
          clone RiscRTE-System-Apps 755cc5174a6deaee120d108cbffe67ae809e1e6f system
          clone RiscRTE-Watch 2f77e01c19f20418e2f91e7181422bc4aabd3c85 watch
      - name: Reproduce deployed error and qualify shared repair
        run: |
          set -euo pipefail
          mkdir -p "$ALARM_ROOT/evidence"
          args=(--runtime "$ALARM_ROOT/runtime" --system-apps "$ALARM_ROOT/system")
          python "$ALARM_ROOT/utilities/scripts/test_alarm_color_sleep.py" "${args[@]}" --watch "$ALARM_ROOT/watch" --output "$ALARM_ROOT/tests" 2>&1 | tee "$ALARM_ROOT/evidence/sleep-tests.log"
          python "$ALARM_ROOT/utilities/scripts/test_alarm_color_startup.py" "${args[@]}" --output "$ALARM_ROOT/startup-tests" 2>&1 | tee "$ALARM_ROOT/evidence/startup-tests.log"
          python "$ALARM_ROOT/utilities/scripts/test_alarm_first_attempt.py" "${args[@]}" --output "$ALARM_ROOT/legacy-tests" 2>&1 | tee "$ALARM_ROOT/evidence/legacy-tests.log"
      - name: Build one GCC15 service and replay exact ELF bytes
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = fff9895c82d744c7237be8847347bdd1b07c6643
          python -c 'import elftools'
          args=(--runtime "$ALARM_ROOT/runtime" --system-apps "$ALARM_ROOT/system" --watch "$ALARM_ROOT/watch" --cc "$(command -v xtensa-esp32s3-elf-gcc)")
          python "$ALARM_ROOT/utilities/scripts/build_alarm_sleep_retry.py" "${args[@]}" --output "$ALARM_ROOT/target" 2>&1 | tee "$ALARM_ROOT/evidence/target.log"
          python "$ALARM_ROOT/utilities/scripts/build_alarm_sleep_retry.py" "${args[@]}" --output "$ALARM_ROOT/replay" 2>&1 | tee "$ALARM_ROOT/evidence/replay.log"
          cmp "$ALARM_ROOT/target/driver.elf" "$ALARM_ROOT/replay/driver.elf"
          cmp "$ALARM_ROOT/target/manifest.json" "$ALARM_ROOT/replay/manifest.json"
          sha256sum "$ALARM_ROOT/target/driver.elf" "$ALARM_ROOT/target/manifest.json" | tee "$ALARM_ROOT/evidence/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: shared-color-alarm-0.4.12-${{ github.sha }}
          path: |
            ${{ env.ALARM_ROOT }}/target/
            ${{ env.ALARM_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 14
