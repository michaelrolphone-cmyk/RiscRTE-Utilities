name: Native Stopwatch qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('sdk/stopwatch-native-sources.json'))
          print('system='+p['system_apps'])
          print('runtime='+p['runtime'])
          PY
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.pin.outputs.system }}
          path: .dependencies/stopwatch-system
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/riscrte
          ref: ${{ steps.pin.outputs.runtime }}
          path: .dependencies/stopwatch-runtime
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native ownership and controller matrices
        run: |
          python3 .dependencies/stopwatch-system/scripts/test_stopwatch_native_input.py
          python3 .dependencies/stopwatch-system/scripts/test_stopwatch_native_adapter.py
          python3 .dependencies/stopwatch-system/scripts/test_stopwatch_native_optout.py
          for mode in '' '--snapshot' '--utc' '--utc --snapshot'; do
            python3 scripts/test_stopwatch_native.py --system-apps .dependencies/stopwatch-system --runtime .dependencies/stopwatch-runtime $mode
          done
      - name: Compatibility controls
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: |
          python3 tests/test_stopwatch_native_profile.py
          python3 scripts/test_stopwatch_hours.py --system-apps .dependencies/stopwatch-system
          python3 scripts/test_stopwatch_native_optout.py --system-apps .dependencies/stopwatch-system --runtime .dependencies/stopwatch-runtime
          python3 .dependencies/stopwatch-system/scripts/test_portable_audio.py
          python3 .dependencies/stopwatch-system/scripts/test_shared_quick_tone_input.py
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Exact target admission
        run: |
          for mode in '' '--snapshot' '--utc' '--utc --snapshot'; do
            python3 scripts/build_stopwatch_native.py --system-apps .dependencies/stopwatch-system --runtime .dependencies/stopwatch-runtime --utilities-commit "$(git rev-parse HEAD)" --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" $mode
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-stopwatch-source-${{ github.sha }}
          path: |
            dist/stopwatch-native/
            build/stopwatch-native/**/receipt.json
            build/stopwatch-native-optout/receipt.json
          if-no-files-found: error
          retention-days: 14
