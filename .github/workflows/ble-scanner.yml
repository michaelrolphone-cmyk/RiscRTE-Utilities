name: BLE Scanner
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'No'
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: f1db70fcc3ba9df2a3551a711a9d3b0b714a5f8a
          path: .dependencies/ble-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: aa5ce0140102bf4d1039e5f208588a6793d06b28
          path: .dependencies/ble-drivers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host model, lifecycle and production Nova pixels
        run: |
          status=0
          python scripts/test_ble_scanner.py --system-apps .dependencies/ble-system || status=1
          python scripts/test_ble_renderer.py --system-apps .dependencies/ble-system --drivers .dependencies/ble-drivers || status=1
          python scripts/test_ble_paper.py --system-apps .dependencies/ble-system --drivers .dependencies/ble-drivers || status=1
          exit "$status"
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build exact-pinned target scanner
        run: |
          python scripts/build_ble_apps.py --system-apps .dependencies/ble-system
          python scripts/build_ble_apps.py --system-apps .dependencies/ble-system --paper-profile --display-rotation 90 --navigation --partial-damage --return-app springboard.elf --output-dir dist/ble-paper
      - uses: actions/upload-artifact@v4
        with:
          name: ble-scanner-${{ github.sha }}
          path: |
            dist/ble-apps/
            dist/ble-paper/
            build/ble-scanner/frames/
            build/ble-renderer/
            build/ble-paper/
          retention-days: 14
          if-no-files-found: error
