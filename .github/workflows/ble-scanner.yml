name: BLE Scanner
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-scanner-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Frozen legacy Watch and paper application control
        uses: actions/checkout@v4
        with:
          ref: ce1c949d797a406d8e16646f5abe1aac0691ef52
          path: .dependencies/legacy-utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: a7f08a9db7342a69ef5b9bc03e3b1ea60dafbb7c
          path: .dependencies/ble-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: aa5ce0140102bf4d1039e5f208588a6793d06b28
          path: .dependencies/ble-drivers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen legacy host model, lifecycle and production Nova pixels
        working-directory: .dependencies/legacy-utilities
        run: |
          python scripts/test_ble_scanner.py --system-apps ../ble-system
          python scripts/test_ble_renderer.py --system-apps ../ble-system --drivers ../ble-drivers
          python scripts/test_ble_paper.py --system-apps ../ble-system --drivers ../ble-drivers
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build frozen legacy Watch and paper target controls
        working-directory: .dependencies/legacy-utilities
        run: |
          python scripts/build_ble_apps.py --system-apps ../ble-system
          python scripts/build_ble_apps.py --system-apps ../ble-system --paper-profile --display-rotation 90 --navigation --partial-damage --return-app springboard.elf --output-dir dist/ble-paper
      - uses: actions/upload-artifact@v4
        with:
          name: ble-scanner-legacy-controls-${{ github.sha }}
          # Explicit output paths only; the checkout lives under .dependencies.
          include-hidden-files: true
          path: |
            .dependencies/legacy-utilities/dist/ble-apps/
            .dependencies/legacy-utilities/dist/ble-paper/
            .dependencies/legacy-utilities/build/ble-scanner/frames/
            .dependencies/legacy-utilities/build/ble-renderer/
            .dependencies/legacy-utilities/build/ble-paper/
          retention-days: 14
          if-no-files-found: error

  current-shared-host-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Current shared UI source
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 8a75862929e4e83c8f66b3d58cc1c36d44830c84
          path: .dependencies/current-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: b25b1d467a557e8d693211cff2eff959eb9c79de
          path: .dependencies/current-runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: 4088b6892c2e2654b0342f04a7d191068e4a8e2e
          path: .dependencies/current-drivers
          persist-credentials: false
      - name: Exact display base and power contracts
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 45cf61ac013fb618e8d7fed63217a35350484d52
          path: .dependencies/display-reader
          persist-credentials: false
      - name: Exact display metrics and snapshot contracts
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiskRTE-XTEINK-X4-PRO
          ref: cbf4bfd34372bf87ccf60429e062a6e96d043aca
          path: .dependencies/display-x4
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify dependency-role and custody regression contracts
        run: python -m unittest discover -s tests -p test_scanner_ci_source_roles.py -v
      - name: Current Scanner, ordered input and shared hosts, normal and sanitizers
        run: >-
          python scripts/test_x4_ble_shared_text.py --source-only
          --system-apps .dependencies/current-system --system-revision 8a75862929e4e83c8f66b3d58cc1c36d44830c84
          --runtime .dependencies/current-runtime --runtime-revision b25b1d467a557e8d693211cff2eff959eb9c79de
          --drivers .dependencies/current-drivers --drivers-revision 4088b6892c2e2654b0342f04a7d191068e4a8e2e
          --reader .dependencies/display-reader --reader-revision 45cf61ac013fb618e8d7fed63217a35350484d52
          --x4 .dependencies/display-x4 --x4-revision cbf4bfd34372bf87ccf60429e062a6e96d043aca
          --output build/scanner-current-host
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build current shared-text foreground with explicit compatible sources
        env:
          NATIVE_APP_CC: /home/runner/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc
        run: >-
          python scripts/build_x4_resident_clients.py --resident-shell-client --app ble_scanner
          --system-apps .dependencies/current-system --system-revision 8a75862929e4e83c8f66b3d58cc1c36d44830c84
          --runtime .dependencies/current-runtime --runtime-revision b25b1d467a557e8d693211cff2eff959eb9c79de
          --display-sdk build/scanner-current-host/sdk/include
          --output "${{ github.workspace }}/dist/scanner-current"
      - name: Check current target and host profile agreement
        run: python scripts/check_scanner_ci_profile.py --build dist/scanner-current --host build/scanner-current-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ble-scanner-current-shared-host-${{ github.sha }}
          path: |
            dist/scanner-current/
            build/scanner-current-host/summary.json
            build/scanner-current-host/*/scanner-state.log
            build/scanner-current-host/*/*/run.log
            build/scanner-current-host/*/*/actions.txt
          retention-days: 14
          if-no-files-found: error
