name: BLE Scanner
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: c5c76883fa4db4de9c81345fdb225b38192231c1
          path: .dependencies/ble-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: aa5ce0140102bf4d1039e5f208588a6793d06b28
          path: .dependencies/ble-drivers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host model, lifecycle and production Nova pixels
        run: |
          python scripts/test_ble_scanner.py --system-apps .dependencies/ble-system
          python scripts/test_ble_renderer.py --system-apps .dependencies/ble-system --drivers .dependencies/ble-drivers
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build exact-pinned target scanner
        run: python scripts/build_ble_apps.py --system-apps .dependencies/ble-system
      - uses: actions/upload-artifact@v4
        with:
          name: ble-scanner-${{ github.sha }}
          path: |
            dist/ble-apps/
            build/ble-scanner/frames/
            build/ble-renderer/
          retention-days: 14
          if-no-files-found: error
