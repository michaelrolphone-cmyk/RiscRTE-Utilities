name: Publish verified scene source checkpoint
on:
  push:
    branches: [feat/declarative-alarms]
    paths: ['.scene-source.patch.gz.*']
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/feat/declarative-alarms'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and publish the tested source bytes
        run: |
          python - <<'PY'
          import gzip, hashlib, pathlib, subprocess
          parts=sorted(pathlib.Path('.').glob('.scene-source.patch.gz.*'))
          assert [p.suffix for p in parts]==['.000','.001','.002','.003a','.003b','.004']
          chunks=[bytearray(p.read_bytes()) for p in parts]
          # Correct a diagnosed transport byte before validating the complete original digest.
          assert chunks[0][148]==195
          chunks[0][148]=211
          compressed=b''.join(chunks)
          assert hashlib.sha256(compressed).hexdigest()=='aadc9bda07ff8f581946973bfe3fee9507b5a4ef3e4a13fa07060a47b2ad7474'
          patch=gzip.decompress(compressed)
          allowed={'Apps/alarms_scene.c','Apps/alarms_scene.json','Services/alarm_control/control.c','Services/alarm_control/raw.json','Services/alarm_control/utc.json','docs/DECLARATIVE_ALARMS.md','lib/Alarm/include/AlarmControlV1.h','scripts/build_alarms_scene.py','scripts/compose_alarms_scene.py','scripts/scene_support.py','scripts/test_alarms_scene.py','scripts/test_alarms_scene_composition.py','scripts/test_alarms_scene_runtime.py','test/scene/app_test.c','test/scene/control_test.c','test/scene/runtime_app_hooks.c','test/scene/runtime_hardware.c','test/scene/runtime_launcher.c','test/scene/runtime_provider.c','test/scene/runtime_test.cpp'}
          rows=subprocess.check_output(['git','apply','--numstat'],input=patch).decode().splitlines()
          assert {r.split('\t',2)[2] for r in rows}==allowed
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm',*map(str,parts)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: prototype declarative Alarms with independent domain control and restorable ELF lifecycle'
          git push origin HEAD:refs/heads/feat/declarative-alarms
