name: Native Battery qualification

on:
  push:
    branches: [main, work/battery-native-overlays-20261017]
    paths:
      - 'Apps/battery.c'
      - 'Apps/battery_power.inc'
      - 'Apps/battery_native*'
      - 'Apps/utility_frame.h'
      - 'Apps/utility_preference_atomic.h'
      - 'Apps/alarm_writer.h'
      - 'profiles/native-battery*.json'
      - 'Apps/native/battery.json'
      - 'scripts/*native_battery*.py'
      - 'scripts/build_native_battery_qualification.py'
      - 'scripts/test_battery_native*.py'
      - 'test/native_apps/battery_native*'
      - 'tests/battery_native_layout_test.c'
      - 'tests/test_native_battery*.py'
      - 'docs/native-battery/**'
      - '.github/workflows/native-battery.yml'
  pull_request:
    paths:
      - 'Apps/battery.c'
      - 'Apps/battery_power.inc'
      - 'Apps/battery_native*'
      - 'Apps/utility_frame.h'
      - 'Apps/utility_preference_atomic.h'
      - 'Apps/alarm_writer.h'
      - 'profiles/native-battery*.json'
      - 'Apps/native/battery.json'
      - 'scripts/*native_battery*.py'
      - 'scripts/build_native_battery_qualification.py'
      - 'scripts/test_battery_native*.py'
      - 'test/native_apps/battery_native*'
      - 'tests/battery_native_layout_test.c'
      - 'tests/test_native_battery*.py'
      - 'docs/native-battery/**'
      - '.github/workflows/native-battery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Checkout exact Utilities candidate and baseline history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned shared foundation
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: b8e34df8b33096663d92b469dff225d130217354
          fetch-depth: 0
          path: .dependencies/native-battery-system
          persist-credentials: false
      - name: Checkout pinned generic Watch bridges
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 6e82fdcaec0b73ed700d2104cfb4d94f011c19d4
          path: .dependencies/native-battery-watch
          persist-credentials: false
      - name: Checkout pinned Runtime SDK
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 48229bd1593a2e24e95bf4537b495ee615990fd3
          path: .dependencies/native-battery-runtime
          persist-credentials: false
      - name: Checkout pinned alarm compatibility headers
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
          ref: b9862e1379813a0914d4926ef59a3feb6fcf656a
          path: .dependencies/native-battery-profile
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recipe contracts and exact CI input pins
        run: |
          set -euo pipefail
          mkdir -p dist/native-battery-ci/evidence
          python -m unittest discover -s tests -p 'test_native_battery*.py' -v 2>&1 | tee dist/native-battery-ci/evidence/recipe.log
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          profile = json.loads(Path('profiles/native-battery-qualification.json').read_text())
          directories = {
              'system': '.dependencies/native-battery-system',
              'bridges': '.dependencies/native-battery-watch',
              'runtime': '.dependencies/native-battery-runtime',
              'profile_source': '.dependencies/native-battery-profile',
          }
          for owner, directory in directories.items():
              actual = subprocess.check_output(['git', '-C', directory, 'rev-parse', 'HEAD'], text=True).strip()
              if actual != profile['pins'][owner]:
                  raise SystemExit(owner + ': workflow/profile pin mismatch')
          subprocess.run(['git', 'cat-file', '-e', profile['utilities_base'] + '^{commit}'], check=True)
          Path('dist/native-battery-ci/evidence/input-pins.json').write_text(json.dumps(profile['pins'], indent=2) + '\n')
          PY
      - name: Geometry normal and ASan UBSan
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror tests/battery_native_layout_test.c -o dist/native-battery-ci/layout-normal
          dist/native-battery-ci/layout-normal 2>&1 | tee dist/native-battery-ci/evidence/layout-normal.log
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie tests/battery_native_layout_test.c -o dist/native-battery-ci/layout-sanitized
          dist/native-battery-ci/layout-sanitized 2>&1 | tee dist/native-battery-ci/evidence/layout-sanitized.log
      - name: Install official pinned ESP32-S3 compiler
        run: |
          set -euo pipefail
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Full-feature target admission and exact legacy control
        env:
          NATIVE_APP_CC: /home/runner/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc
        run: |
          set -euo pipefail
          "$NATIVE_APP_CC" --version | head -1 | tee dist/native-battery-ci/evidence/compiler.log
          grep -F '8.4.0' dist/native-battery-ci/evidence/compiler.log
          grep -F '2021r2-patch5' dist/native-battery-ci/evidence/compiler.log
          python scripts/build_native_battery_qualification.py \
            --system .dependencies/native-battery-system \
            --bridges .dependencies/native-battery-watch \
            --runtime .dependencies/native-battery-runtime \
            --profile-source .dependencies/native-battery-profile \
            --output-dir dist/native-battery-ci/target \
            --native-ui 2>&1 | tee dist/native-battery-ci/evidence/target.log
      - name: Reduced controller and adapter host matrix normal and ASan UBSan
        run: |
          set -euo pipefail
          # Use the exact immutable stage and Runtime-header overlay admitted above.
          # This UI fixture remains separate from the complete target feature recipe.
          system=dist/native-battery-ci/target/inputs/system
          python scripts/test_battery_native.py --system-apps "$system" --output dist/native-battery-ci/host-normal 2>&1 | tee dist/native-battery-ci/evidence/host-normal.log
          python scripts/test_battery_native.py --system-apps "$system" --output dist/native-battery-ci/host-sanitized --sanitize 2>&1 | tee dist/native-battery-ci/evidence/host-sanitized.log
      - name: Delayed async ownership and interruption matrices normal and ASan UBSan
        run: |
          set -euo pipefail
          system=dist/native-battery-ci/target/inputs/system
          python scripts/test_battery_native.py --system-apps "$system" --output dist/native-battery-ci/async-normal --async 2>&1 | tee dist/native-battery-ci/evidence/async-normal.log
          python scripts/test_battery_native.py --system-apps "$system" --output dist/native-battery-ci/async-sanitized --async --sanitize 2>&1 | tee dist/native-battery-ci/evidence/async-sanitized.log
      - name: Full-feature temporal, snapshot, custody and negative controls
        run: |
          set -euo pipefail
          args=(--input-receipt dist/native-battery-ci/target/qualification.json
            --system .dependencies/native-battery-system --bridges .dependencies/native-battery-watch
            --runtime .dependencies/native-battery-runtime --profile-source .dependencies/native-battery-profile)
          for mode in temporal snapshot original selector-off; do
            for san in normal sanitized; do
              extra=()
              if [[ "$mode" != temporal ]]; then extra+=(--"$mode"); fi
              if [[ "$san" == sanitized ]]; then extra+=(--sanitize); fi
              python scripts/test_battery_native_temporal.py "${args[@]}" "${extra[@]}" \
                --output "dist/native-battery-ci/$mode-$san" 2>&1 | tee "dist/native-battery-ci/evidence/$mode-$san.log"
            done
          done
      - name: Full-feature native Quick and alarm overlays
        run: |
          set -euo pipefail
          args=(--input-receipt dist/native-battery-ci/target/qualification.json
            --system .dependencies/native-battery-system --bridges .dependencies/native-battery-watch
            --runtime .dependencies/native-battery-runtime --profile-source .dependencies/native-battery-profile)
          for snapshot in direct snapshot; do
            for san in normal sanitized; do
              extra=(--overlays); name=overlays
              if [[ "$snapshot" == snapshot ]]; then extra+=(--snapshot); name+=-snapshot; fi
              if [[ "$san" == sanitized ]]; then extra+=(--sanitize); fi
              python scripts/test_battery_native_temporal.py "${args[@]}" "${extra[@]}" \
                --output "dist/native-battery-ci/$name-$san" 2>&1 | tee "dist/native-battery-ci/evidence/$name-$san.log"
            done
          done
      - name: Exact-source standalone package and production loader admission
        run: |
          set -euo pipefail
          python scripts/prepare_native_battery_release.py --artifact dist/native-battery-ci \
            --system .dependencies/native-battery-system --runtime .dependencies/native-battery-runtime \
            2>&1 | tee dist/native-battery-ci/evidence/standalone.log
          python scripts/publish_native_battery.py --artifact dist/native-battery-ci \
            --source-sha '${{ github.event.pull_request.head.sha || github.sha }}' \
            --repository '${{ github.repository }}' --validate-only
      - name: Upload exact source, target and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-battery-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/native-battery-ci/
            !dist/native-battery-ci/**/battery-native-test
            !dist/native-battery-ci/layout-normal
            !dist/native-battery-ci/layout-sanitized
            !dist/native-battery-ci/target/validate-elf
            !dist/native-battery-ci/**/__pycache__/
          if-no-files-found: error
          retention-days: 30
  publish-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qualification
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-battery-qualification-${{ github.sha }}
          path: qualified
      - name: Publish or verify immutable standalone development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_native_battery.py --artifact qualified --repository '${{ github.repository }}' --source-sha '${{ github.sha }}'
