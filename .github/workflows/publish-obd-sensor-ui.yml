name: Publish tested OBD sensor UI source
on:
  push:
    branches: [fix/obd-sensor-ui-20261012]
    paths: [.github/workflows/publish-obd-sensor-ui.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/obd-sensor-ui-20261012
          fetch-depth: 2
      - name: Apply exact tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b9eb53f88f28e8fa90716a5a2e75e099b464fb22
          python - <<'PY'
          import base64,hashlib,pathlib,subprocess,zlib
          payload=''''''
          raw=zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest()=='e55bda5dd9a86f477296922fb3c00506df8a951760e0657fee9029ed1bea1a3b'
          path=pathlib.Path('/tmp/obd-ui.patch');path.write_bytes(raw)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
          git rm .github/workflows/publish-obd-sensor-ui.yml
          git add .github/workflows/obd-dashboard.yml Apps/obd_dashboard.json Apps/obd_dashboard/actions.inc Apps/obd_dashboard/app.c Apps/obd_dashboard/ui.inc Apps/obd_dashboard/ui_loop.inc docs/obd-sensor-ui/README.md scripts/test_obd_dashboard.py test/obd/app_test.c test/obd/ui_regression.inc test/obd/ui_regression_probe.c test/obd/ui_selection_test.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'OBD 0.2.3: acknowledge checkbox edits and bound scene work independently of display latency'
          git push origin HEAD:fix/obd-sensor-ui-20261012
