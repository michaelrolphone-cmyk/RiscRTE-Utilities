name: T039 BLE qualification only
on:
  push:
    branches: [work/t039-candidate-qualification-20261021]
  pull_request:
    paths: ['scripts/qualify_t039_ble_candidate.py', 'tests/test_t039_ble_candidate.py', 'docs/t039/candidate-qualification/**', '.github/workflows/t039-ble-candidate.yml']
permissions:
  contents: read
jobs:
  qualify-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 6b2047500905f8f45087cb49989103a926fc5c63
          path: .dependencies/parent-utilities
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: f3731ab02127dea86a308472e3780068c5a0a1cf
          path: .dependencies/system
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: f1db70fcc3ba9df2a3551a711a9d3b0b714a5f8a
          path: .dependencies/legacy-system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 0aab2fd3b03b4190d638e23c79a465afeecf5dfb
          path: .dependencies/runtime
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 6e82fdcaec0b73ed700d2104cfb4d94f011c19d4
          path: .dependencies/bridges
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 851b8998e804c57b2c9f42d9f8fd0a69e79f2b41
          path: .dependencies/watch-touch
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Candidate evidence and unchanged frozen packaging contracts
        run: |
          python -m unittest discover -s tests -p test_t039_ble_candidate.py -v
          python -m unittest discover -s tests -p test_native_ble_buttons_release.py -v
      - name: Install existing pinned qualification compiler
        run: |
          python -m pip install Pillow platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Non-distributable parent and T039 candidate controls
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qualify_t039_ble_candidate.py qualify --parent-utilities .dependencies/parent-utilities --system .dependencies/system --legacy-system .dependencies/legacy-system --runtime .dependencies/runtime --bridges .dependencies/bridges --watch .dependencies/watch-touch --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --output dist/t039-qualification-only
          echo "receipt_sha256=$(sha256sum dist/t039-qualification-only/candidate-evidence.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t039-qualification-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/t039-qualification-only/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/download-artifact@v4
        with:
          name: t039-qualification-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/t039-qualification-only-downloaded
      - name: Verify transported qualification evidence without publishing
        run: |
          python scripts/qualify_t039_ble_candidate.py verify --artifact "$RUNNER_TEMP/t039-qualification-only-downloaded" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" --receipt-sha256 "${{ steps.evidence.outputs.receipt_sha256 }}"
