name: SDR Waterfall
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  waterfall:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 2d16d9dfa7abc50ce916eebc11d81423adef0000
          path: .dependencies/waterfall-system
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/test_waterfall.py --system-apps .dependencies/waterfall-system
      - run: python -m pip install platformio==6.1.19
      - run: pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - run: python scripts/build_waterfall.py --system-apps .dependencies/waterfall-system
      - uses: actions/upload-artifact@v4
        with:
          name: waterfall-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/waterfall/
          if-no-files-found: error
