name: NOVA battery power screens
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  battery-power:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          # Frozen Watch 1.1.46 producer adapter and elapsed-time host fixture.
          ref: 96742a20af660808cae6cd3a36eadd12a83a460f
          path: .dependencies/power-system
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual app and adapter, normal and ASan/UBSan
        run: |
          python -m unittest discover -s tests -p test_battery_power_ci.py -v
          python scripts/test_battery_power.py --system-apps .dependencies/power-system
          python scripts/test_battery_charging.py --system-apps .dependencies/power-system
          python scripts/test_apps.py
      - name: Pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Non-distributable power-profile target structural verification
        run: python scripts/build_battery_power.py --system-apps .dependencies/power-system
      - uses: actions/upload-artifact@v4
        with:
          name: battery-power-qualification-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/battery-power/
            build/battery-power/frames-0-*/
            build/battery-charging/frames-0-*/
          retention-days: 14
          if-no-files-found: error
